<title>ระบบสร้างหนังสือให้ความยินยอมและใบคำขอสินเชื่อ</title>

<style>:root{--p:#176b87;--pd:#104f66;--t:#1d3442;--m:#687b86;--b:#d6e0e5;--e:#b42318;--s:#157347;--bg:#f4f7f8;--soft:#f8fafb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 Tahoma,Arial,sans-serif}header{padding:24px 18px 44px;background:var(--pd);color:#fff}header>div,main{max-width:980px;margin:auto}h1{margin:0;font-size:clamp(22px,4vw,30px)}main{margin-top:-24px;padding:0 14px 40px}.card{padding:24px;background:#fff;border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 24px #17384a12}h2{margin:0 0 16px;color:var(--pd);font-size:19px}.section-title{margin-top:26px;padding-top:22px;border-top:1px solid var(--b)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;margin-bottom:6px;color:#294859;font-size:13px;font-weight:700}label small,.helper,.count{color:var(--m);font-weight:400}input,select,textarea{width:100%;border:1px solid var(--b);border-radius:8px;background:#fff;color:var(--t);font:inherit}input,select{min-height:42px;padding:9px 11px}textarea{min-height:82px;padding:10px 11px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #176b8726;border-color:var(--p)}.invalid{border-color:var(--e)!important}.registration-field,.section-box{padding:15px;border:1px solid var(--b);border-radius:10px;background:var(--soft)}.section-box{margin-top:20px}.section-box h3{margin:0 0 12px;color:var(--pd);font-size:16px}.registration-toolbar,.dbd-buttons,.actions{display:flex;align-items:center;gap:10px}.registration-toolbar{justify-content:space-between;margin-top:8px}.dbd-buttons{flex-wrap:wrap}.count,.helper{font-size:12px}.count.complete{color:var(--s);font-weight:700}.lookup-button{padding:7px 10px;border:1px solid var(--p);border-radius:7px;background:#fff;color:var(--p);font-weight:700;cursor:pointer}.error-message{display:block;min-height:17px;margin-top:4px;color:var(--e);font-size:12px}.authorized-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.asset-scroll{overflow-x:auto}.asset-table{width:100%;min-width:820px;border-collapse:collapse}.asset-table th,.asset-table td{padding:7px;border:1px solid var(--b);vertical-align:top}.asset-table th{background:#edf3f6;text-align:left;font-size:12px}.quantity-column{width:72px}.condition-column{width:110px}.brand-column{width:150px}.detail-column{min-width:240px}.price-column{width:170px}.price-input{text-align:right;font-variant-numeric:tabular-nums}.actions{justify-content:flex-end;margin-top:24px;padding-top:18px;border-top:1px solid var(--b)}.actions button{min-height:42px;padding:9px 16px;border-radius:8px;font-weight:700;cursor:pointer}.secondary-button{border:1px solid var(--b);background:#fff;color:var(--t)}.primary-button{min-width:220px;border:0;background:var(--p);color:#fff}button:focus-visible{outline:3px solid #176b8740;outline-offset:2px}button:disabled{opacity:.55;cursor:wait}#status{min-height:22px;margin-top:10px;text-align:right;font-size:13px}#status.loading{color:var(--p)}#status.success{color:var(--s)}#status.error{padding:9px 11px;border-radius:7px;background:#fff1f0;color:var(--e);text-align:left}@media(max-width:720px){header{padding:20px 14px 38px}main{margin-top:-20px;padding:0 10px 32px}.card{padding:16px}.grid,.authorized-row{grid-template-columns:1fr;gap:13px}.full{grid-column:auto}.registration-toolbar{align-items:flex-start;flex-direction:column}.actions{position:sticky;bottom:0;z-index:10;flex-direction:column-reverse;margin:18px -16px -16px;padding:12px 16px;background:#fff;box-shadow:0 -6px 18px #17384a14}.actions button{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}</style>

<body>
<header><div><h1>ระบบสร้างหนังสือให้ความยินยอมและใบคำขอสินเชื่อ</h1></div></header>
<main><section class="card"><form id="pdfForm" novalidate>
<h2>เลือกเอกสาร</h2>
<div class="grid"><div class="full"><label for="template">เอกสารที่ต้องการสร้าง</label><select id="template" name="template"><option value="both">สร้างทั้งสองไฟล์</option><option value="application">ใบคำขอสินเชื่อ</option><option value="disclosure">หนังสือให้ความยินยอม</option></select></div></div>
<h2 class="section-title">ข้อมูลสำหรับกรอกเอกสาร</h2>
<div class="grid">
<div class="full"><label for="consentPlace">ทำที่ <small>(Consent)</small></label><input id="consentPlace" name="consentPlace" value="บริษัท ไทยโอริกซ์ลีสซิ่ง จำกัด"></div>
<div class="full"><label for="documentDate">วันที่ทำเอกสาร <small>(ปี พ.ศ. คำนวณให้อัตโนมัติ)</small></label><input id="documentDate" name="documentDate" type="date"></div>
<div class="full registration-field"><label for="companyRegNo">ทะเบียนนิติบุคคลเลขที่ 13 หลัก *</label><input id="companyRegNo" name="companyRegNo" inputmode="numeric" maxlength="13" placeholder="0105542073726" aria-describedby="companyRegNoError"><div class="registration-toolbar"><span class="count" id="digitCount">0/13 หลัก</span><div class="dbd-buttons"><button class="lookup-button" id="dbdHomeButton" type="button">เปิด DBD DataWarehouse</button><button class="lookup-button" id="dbdLookupButton" type="button">ค้นหาที่ DBD</button><span class="helper">ตัวอย่าง 0105542073726</span></div></div><small class="error-message" id="companyRegNoError"></small></div>
<div class="full"><label for="companyName">ชื่อนิติบุคคล *</label><input id="companyName" name="companyName" aria-describedby="companyNameError"><small class="error-message" id="companyNameError"></small></div>
<div><label for="companyType">ประเภทนิติบุคคล <small>(Consent)</small></label><select id="companyType" name="companyType"><option value="">-- เลือกประเภท --</option><option>บริษัทจำกัด</option><option>บริษัทมหาชนจำกัด</option><option>ห้างหุ้นส่วนจำกัด</option><option>ห้างหุ้นส่วนสามัญนิติบุคคล</option><option>มูลนิธิ</option><option>สมาคม</option><option>อื่น ๆ</option></select></div>
<div><label for="registrationDate">วันที่จดทะเบียน</label><input id="registrationDate" name="registrationDate" type="text" autocomplete="off" maxlength="50" placeholder="เช่น 24 กุมภาพันธ์ 2560"></div>
<div class="full"><label for="companyAddress">ที่อยู่บริษัท <small>(Application)</small></label><textarea id="companyAddress" name="companyAddress"></textarea></div>
<div><label for="phoneNo">หมายเลขโทรศัพท์</label><input id="phoneNo" name="phoneNo" inputmode="tel"></div><div><label for="faxNo">โทรสาร</label><input id="faxNo" name="faxNo" inputmode="tel"></div>
<div class="full authorized-row"><div><label for="authorizedName">ผู้มีอำนาจกระทำการ คนที่ 1</label><input id="authorizedName" name="authorizedName"></div><div><label for="authorizedName2">ผู้มีอำนาจกระทำการ คนที่ 2</label><input id="authorizedName2" name="authorizedName2"></div></div>
<div class="full"><label for="registrarOffice">หน่วยงานที่ออกทะเบียน <small>(Consent)</small></label><input id="registrarOffice" name="registrarOffice" value="กรมพัฒนาธุรกิจการค้า กระทรวงพาณิชย์"></div>
<div class="full section-box"><h3>ผู้ติดต่อคนที่ 1</h3><div class="grid"><div><label for="contactName1">ชื่อผู้ติดต่อ</label><input id="contactName1" name="contactName1"></div><div><label for="contactPhone1">โทรศัพท์</label><input id="contactPhone1" name="contactPhone1" inputmode="tel"></div><div class="full"><label for="contactEmail1">อีเมล</label><input id="contactEmail1" name="contactEmail1" type="email" aria-describedby="contactEmail1Error"><small class="error-message" id="contactEmail1Error"></small></div></div></div>
<div class="full section-box"><h3>ผู้ติดต่อคนที่ 2</h3><div class="grid"><div><label for="contactName2">ชื่อผู้ติดต่อ</label><input id="contactName2" name="contactName2"></div><div><label for="contactPhone2">โทรศัพท์</label><input id="contactPhone2" name="contactPhone2" inputmode="tel"></div><div class="full"><label for="contactEmail2">อีเมล</label><input id="contactEmail2" name="contactEmail2" type="email" aria-describedby="contactEmail2Error"><small class="error-message" id="contactEmail2Error"></small></div></div></div>
<div class="full section-box"><h3>ข้อมูลสินเชื่อ</h3><label for="loanType">ประเภทสินเชื่อ</label><select id="loanType" name="loanType"><option value="">-- เลือกประเภทสินเชื่อ --</option><option>Lease</option><option>Hire Purchase</option><option>Loan</option><option>Refinance</option><option>Working Capital</option></select></div>
<div class="full section-box"><h3>รายการทรัพย์สิน</h3><div class="asset-scroll"><table class="asset-table"><thead><tr><th class="quantity-column">จำนวน</th><th class="condition-column">สภาพ ใหม่/เก่า</th><th class="brand-column">ยี่ห้อ</th><th class="detail-column">ประเภท / รายละเอียด</th><th class="price-column">ราคา รวม VAT</th></tr></thead><tbody>
<tr><td><input id="itemQty1" name="itemQty1" inputmode="numeric"></td><td><select id="itemCondition1" name="itemCondition1"><option value=""></option><option>ใหม่</option><option>เก่า</option></select></td><td><input id="itemBrand1" name="itemBrand1"></td><td><input id="itemDetail1" name="itemDetail1"></td><td><input class="price-input" id="itemPrice1" name="itemPrice1" inputmode="decimal"><small class="error-message" id="itemPrice1Error"></small></td></tr>
<tr><td><input id="itemQty2" name="itemQty2" inputmode="numeric"></td><td><select id="itemCondition2" name="itemCondition2"><option value=""></option><option>ใหม่</option><option>เก่า</option></select></td><td><input id="itemBrand2" name="itemBrand2"></td><td><input id="itemDetail2" name="itemDetail2"></td><td><input class="price-input" id="itemPrice2" name="itemPrice2" inputmode="decimal"><small class="error-message" id="itemPrice2Error"></small></td></tr>
<tr><td><input id="itemQty3" name="itemQty3" inputmode="numeric"></td><td><select id="itemCondition3" name="itemCondition3"><option value=""></option><option>ใหม่</option><option>เก่า</option></select></td><td><input id="itemBrand3" name="itemBrand3"></td><td><input id="itemDetail3" name="itemDetail3"></td><td><input class="price-input" id="itemPrice3" name="itemPrice3" inputmode="decimal"><small class="error-message" id="itemPrice3Error"></small></td></tr>
<tr><td><input id="itemQty4" name="itemQty4" inputmode="numeric"></td><td><select id="itemCondition4" name="itemCondition4"><option value=""></option><option>ใหม่</option><option>เก่า</option></select></td><td><input id="itemBrand4" name="itemBrand4"></td><td><input id="itemDetail4" name="itemDetail4"></td><td><input class="price-input" id="itemPrice4" name="itemPrice4" inputmode="decimal"><small class="error-message" id="itemPrice4Error"></small></td></tr>
</tbody></table></div></div>
</div>
<div class="actions"><button class="secondary-button" type="reset">ล้างข้อมูล</button><button class="primary-button" id="submitButton" type="submit">สร้างและดาวน์โหลด PDF</button></div><div id="status" aria-live="polite"></div>
</form></section></main>
<script src="MAPPING1.js"></script>
<script src="MAPPING2.js"></script>
<script>
'use strict';
const FONT_BASE='https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-thai@5.2.6/files/';
const THAI_FONT_URL=FONT_BASE+'noto-sans-thai-thai-400-normal.woff';
const LATIN_FONT_URL=FONT_BASE+'noto-sans-thai-latin-400-normal.woff';
const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const form=document.getElementById('pdfForm'),registrationInput=document.getElementById('companyRegNo'),digitCount=document.getElementById('digitCount'),statusBox=document.getElementById('status'),submitButton=document.getElementById('submitButton'),dateInput=document.getElementById('documentDate');
function getMapping(type){if(typeof MAPPING1==='undefined')throw Error('โหลด MAPPING1.js ไม่สำเร็จ');if(typeof MAPPING2==='undefined')throw Error('โหลด MAPPING2.js ไม่สำเร็จ');return type==='application'?MAPPING2:MAPPING1}
async function loadBytes(url){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error(`โหลดไฟล์ไม่สำเร็จ (${response.status}): ${url}`);return new Uint8Array(await response.arrayBuffer())}
function safeFileName(value){return String(value).replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,120)}
function addDateFields(data){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(data.documentDate||'');if(!m)return data;const year=+m[1]+543,month=+m[2],day=+m[3];data.dateDay=String(day);data.dateMonth=THAI_MONTHS[month-1];data.dateYear=String(year);data.dateShort=`${String(day).padStart(2,'0')}/${String(month).padStart(2,'0')}/${year}`;return data}
const isThaiCharacter=c=>/[\u0E00-\u0E7F\u200B-\u200D]/.test(c);
function splitRuns(text){const output=[];for(const character of text){const thai=isThaiCharacter(character),last=output[output.length-1];if(last&&last.thai===thai)last.text+=character;else output.push({thai,text:character})}return output}
function measureText(text,size,fonts){return splitRuns(text).reduce((total,run)=>total+(run.thai?fonts.thai:fonts.latin).widthOfTextAtSize(run.text,size),0)}
function drawRuns(page,text,x,y,size,fonts,rgb){for(const run of splitRuns(text)){const font=run.thai?fonts.thai:fonts.latin;page.drawText(run.text,{x,y,size,font,color:rgb(0,0,0)});x+=font.widthOfTextAtSize(run.text,size)}}
function fitTextSize(text,size,min,max,fonts){if(!max)return size;const width=measureText(text,size,fonts);return width<=max?size:Math.max(min,size*max/width)}
function wrapText(text,max,size,fonts){const lines=[];for(const paragraph of text.split(/\r?\n/)){let current='';for(const word of paragraph.split(/(?<=\s)/)){if(measureText(current+word,size,fonts)<=max){current+=word;continue}if(current.trim()){lines.push(current.trimEnd());current=''}let piece='';for(const character of word){if(piece&&measureText(piece+character,size,fonts)>max){lines.push(piece);piece=''}piece+=character}current=piece}if(current.trim()||!lines.length)lines.push(current.trimEnd())}return lines}
function drawField(page,position,value,fonts,rgb){const min=position.minSize||6;if(position.lines>1){let size=position.size||8,lines;for(;;){lines=wrapText(value,position.maxWidth,size,fonts);if(lines.length<=position.lines||size<=min)break;size-=.5}if(lines.length>position.lines)lines=[...lines.slice(0,position.lines-1),lines.slice(position.lines-1).join(' ')];const lineHeight=position.lineHeight||size*1.2;lines.forEach((line,index)=>drawRuns(page,line,position.x,position.y-index*lineHeight,fitTextSize(line,size,min,position.maxWidth,fonts),fonts,rgb));return}const size=fitTextSize(value,position.size||8,min,position.maxWidth,fonts),width=measureText(value,size,fonts),x=position.align==='center'&&position.maxWidth?position.x+(position.maxWidth-width)/2:position.x;drawRuns(page,value,x,position.y,size,fonts,rgb)}
let fontBytesCache;
async function loadFontBytes(){if(!fontBytesCache)fontBytesCache=Promise.all([loadBytes(THAI_FONT_URL),loadBytes(LATIN_FONT_URL).catch(()=>null)]);return fontBytesCache}
async function createPdf(data,type){
if(typeof PDFLib==='undefined')throw Error('โหลด pdf-lib ไม่สำเร็จ');if(typeof fontkit==='undefined')throw Error('โหลด fontkit ไม่สำเร็จ');
const cfg=getMapping(type);if(!cfg?.file||!cfg?.fields||!cfg?.registration)throw Error(`โครงสร้าง Mapping ของ ${type} ไม่ครบ`);
const{PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.load(await loadBytes(cfg.file));doc.registerFontkit(fontkit);
const[thaiBytes,latinBytes]=await loadFontBytes(),fonts={thai:await doc.embedFont(thaiBytes,{subset:true}),latin:latinBytes?await doc.embedFont(latinBytes,{subset:true}):await doc.embedFont(StandardFonts.Helvetica)},pages=doc.getPages(),first=String(data.authorizedName||'').trim(),second=String(data.authorizedName2||'').trim(),isApp=type==='application';
for(const[field,map]of Object.entries(cfg.fields)){
if(isApp&&field==='authorizedNameCenter'){if(first&&!second)for(const p of(Array.isArray(map)?map:[map]))pages[p.page]&&drawField(pages[p.page],p,first,fonts,rgb);continue}
if(isApp&&field==='authorizedName'&&first&&!second){const p=Array.isArray(map)?map[0]:map;pages[p.page]&&drawField(pages[p.page],p,first,fonts,rgb);continue}
if(isApp&&field==='authorizedName2'&&!second)continue;
const value=String(data[field]||'').trim();if(!value)continue;for(const p of(Array.isArray(map)?map:[map]))pages[p.page]&&drawField(pages[p.page],p,value,fonts,rgb)}
const r=cfg.registration,p=pages[r.page],no=String(data.companyRegNo||'');if(!p)throw Error('ไม่พบหน้าสำหรับเลขทะเบียนใน PDF');
if(r.mode==='continuous')drawField(p,r,no,fonts,rgb);else[...no].forEach((n,i)=>{const c=r.centers?.[i];if(c!==undefined)p.drawText(n,{x:c-fonts.latin.widthOfTextAtSize(n,r.size)/2,y:r.y,size:r.size,font:fonts.latin,color:rgb(0,0,0)})});
const prefix=isApp?'ใบคำขอสินเชื่อ':'หนังสือให้ความยินยอม';return{bytes:await doc.save({useObjectStreams:false}),name:`${prefix} - ${safeFileName(data.companyName)}.pdf`}}
function formatPrice(value){const cleaned=String(value).replace(/,/g,'').replace(/[^\d.]/g,'');if(!cleaned)return'';const dot=cleaned.indexOf('.'),whole=(dot>=0?cleaned.slice(0,dot):cleaned).replace(/^0+(?=\d)/,'')||'0',decimal=dot>=0?cleaned.slice(dot+1).replace(/\./g,'').slice(0,2):'',grouped=whole.replace(/\B(?=(\d{3})+(?!\d))/g,',');return dot>=0?`${grouped}.${decimal}`:grouped}
function formatPriceInput(input){const original=input.value,cursor=input.selectionStart??original.length,before=original.slice(0,cursor).replace(/,/g,'').length,formatted=formatPrice(original);input.value=formatted;let next=0,count=0;while(next<formatted.length&&count<before){if(formatted[next]!==',')count++;next++}try{input.setSelectionRange(next,next)}catch{}}
form.addEventListener('input',event=>{if(event.target.classList.contains('price-input'))formatPriceInput(event.target)});
form.addEventListener('focusout',event=>{if(event.target.classList.contains('price-input'))event.target.value=formatPrice(event.target.value)});
function showError(id,message=''){const input=document.getElementById(id),box=document.getElementById(`${id}Error`);input?.classList.toggle('invalid',!!message);input?.setAttribute('aria-invalid',message?'true':'false');if(box)box.textContent=message}
function validEmail(value){return!value||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)}
function collectFormData(){for(let i=1;i<=4;i++){const input=document.getElementById(`itemPrice${i}`);input.value=formatPrice(input.value)}return addDateFields(Object.fromEntries(new FormData(form)))}
function validateForm(data){let valid=true;['companyName','companyRegNo','contactEmail1','contactEmail2','itemPrice1','itemPrice2','itemPrice3','itemPrice4'].forEach(id=>showError(id));if(!String(data.companyName||'').trim()){showError('companyName','กรุณากรอกชื่อนิติบุคคล');valid=false}if(!/^\d{13}$/.test(String(data.companyRegNo||''))){showError('companyRegNo','กรุณากรอกเลขทะเบียนให้ครบ 13 หลัก');valid=false}for(const n of[1,2]){const field=`contactEmail${n}`,email=String(data[field]||'').trim();if(!validEmail(email)){showError(field,'รูปแบบอีเมลไม่ถูกต้อง');valid=false}}for(let i=1;i<=4;i++){const field=`itemPrice${i}`,price=String(data[field]||'').trim();if(price&&!/^\d{1,3}(,\d{3})*(\.\d{0,2})?$/.test(price)){showError(field,'กรุณากรอกราคาให้ถูกต้อง');valid=false}}return valid}
function downloadPdf(bytes,name){const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function setToday(){const d=new Date();dateInput.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
setToday();
registrationInput.addEventListener('input',()=>{registrationInput.value=registrationInput.value.replace(/\D/g,'').slice(0,13);digitCount.textContent=`${registrationInput.value.length}/13 หลัก`;digitCount.classList.toggle('complete',registrationInput.value.length===13)});
document.getElementById('dbdHomeButton').addEventListener('click',()=>window.open('https://datawarehouse.dbd.go.th/','_blank','noopener'));
document.getElementById('dbdLookupButton').addEventListener('click',()=>{if(!/^\d{13}$/.test(registrationInput.value)){showError('companyRegNo','กรุณากรอกเลขทะเบียนให้ครบ 13 หลัก');registrationInput.focus();return}showError('companyRegNo');window.open('https://datawarehouse.dbd.go.th/company/profile/5'+registrationInput.value,'_blank','noopener')});
form.addEventListener('reset',()=>setTimeout(()=>{document.querySelectorAll('.invalid').forEach(el=>{el.classList.remove('invalid');el.setAttribute('aria-invalid','false')});document.querySelectorAll('.error-message').forEach(el=>el.textContent='');digitCount.textContent='0/13 หลัก';digitCount.classList.remove('complete');statusBox.textContent='';statusBox.className='';setToday()}));
form.addEventListener('submit',async event=>{event.preventDefault();const data=collectFormData();if(!validateForm(data)){statusBox.className='error';statusBox.textContent='กรุณาตรวจสอบข้อมูลที่ไฮไลต์';document.querySelector('.invalid')?.focus();return}submitButton.disabled=true;statusBox.className='loading';statusBox.textContent='กำลังโหลด Template และสร้าง PDF...';try{const types=data.template==='both'?['application','disclosure']:[data.template];for(const type of types){const result=await createPdf(data,type);downloadPdf(result.bytes,result.name);await new Promise(resolve=>setTimeout(resolve,700))}statusBox.className='success';statusBox.textContent='สร้างและดาวน์โหลดเอกสารเรียบร้อยแล้ว'}catch(error){console.error(error);statusBox.className='error';statusBox.textContent=error instanceof Error?`สร้าง PDF ไม่สำเร็จ: ${error.message}`:'สร้าง PDF ไม่สำเร็จ'}finally{submitButton.disabled=false}});
</script>
</body>
</html>
