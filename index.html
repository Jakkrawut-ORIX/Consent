<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>ระบบสร้างหนังสือให้ความยินยอมและใบคำขอสินเชื่อ</title>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{--p:#0b67a3;--pd:#084d7a;--t:#17324a;--m:#637b8d;--b:#cedbe5;--e:#bd2c2c;--s:#087846}*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:var(--t);font-family:Tahoma,Arial,sans-serif}header{padding:30px 20px 55px;background:#0b67a3;color:#fff}header>div,main{max-width:1040px;margin:auto}h1{margin:0;font-size:clamp(24px,4vw,34px)}main{margin-top:-30px;padding:0 18px 50px}.card{padding:28px;border-radius:16px;background:#fff;box-shadow:0 18px 50px #1237521a}h2{margin:0 0 16px;color:var(--pd);font-size:20px}.section-title{margin-top:28px;padding-top:24px;border-top:1px solid #e5edf3}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}label{display:block;margin-bottom:7px;font-size:13px;font-weight:700;color:#29465d}small{color:var(--m)}input,select,textarea{width:100%;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--t);font:15px inherit}input,select{min-height:45px;padding:10px 12px}textarea{min-height:92px;padding:11px 12px;resize:vertical}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px #0b67a31f}.invalid{border-color:var(--e)!important}.registration,.box{padding:16px;border:1px solid #cfe4f2;border-radius:13px;background:#f7fbfe}.box{margin-top:24px}.box h3{margin:0 0 14px;color:var(--pd);font-size:16px}.reg-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:9px}.lookup{padding:7px 11px;border:1px solid var(--p);border-radius:8px;background:#fff;color:var(--p);font-weight:700;cursor:pointer}.error{display:block;min-height:18px;margin-top:5px;color:var(--e);font-size:12px}.count{font-size:12px;color:var(--m)}.count.complete{color:var(--s);font-weight:700}.authorized{display:grid;grid-template-columns:1fr 1fr;gap:18px}.scroll{overflow-x:auto}.assets{width:100%;min-width:900px;border-collapse:collapse}.assets th,.assets td{padding:8px;border:1px solid #d8e4ee;vertical-align:top}.assets th{background:#f2f8fc;font-size:13px}.price{text-align:right;font-variant-numeric:tabular-nums}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;padding-top:20px;border-top:1px solid #e5edf3}.actions button{padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{border:1px solid var(--b);background:#fff}.primary{border:0;background:var(--p);color:#fff;min-width:235px}button:disabled{opacity:.55;cursor:wait}#status{min-height:24px;margin-top:12px;text-align:right;font-size:13px}#status.error{padding:10px;border-radius:8px;background:#fff4f4;color:var(--e);text-align:left}#status.success{color:var(--s)}#status.loading{color:var(--p)}@media(max-width:720px){main{padding:0 12px 40px}.card{padding:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.authorized{grid-template-columns:1fr}.reg-tools{align-items:flex-start;flex-direction:column}.actions{position:sticky;bottom:0;z-index:5;flex-direction:column-reverse;margin:20px -18px 0;padding:12px 18px;background:#fff;box-shadow:0 -8px 20px #12375214}.actions button{width:100%}}
</style>
</head>
<body>
<header><div><h1>ระบบสร้างหนังสือให้ความยินยอมและใบคำขอสินเชื่อ</h1></div></header>
<main><section class="card"><form id="pdfForm" novalidate>
<h2>เลือกเอกสาร</h2>
<div class="grid"><div class="full"><label for="template">เอกสารที่ต้องการสร้าง</label><select id="template" name="template"><option value="both">สร้างทั้งสองไฟล์</option><option value="application">ใบคำขอสินเชื่อ</option><option value="disclosure">หนังสือให้ความยินยอม</option></select></div></div>
<h2 class="section-title">ข้อมูลสำหรับกรอกเอกสาร</h2>
<div class="grid">
<div class="full"><label for="consentPlace">ทำที่ <small>(Consent)</small></label><input id="consentPlace" name="consentPlace" value="บริษัท ไทยโอริกซ์ลีสซิ่ง จำกัด"></div>
<div class="full"><label for="documentDate">วันที่ทำเอกสาร</label><input id="documentDate" name="documentDate" type="date"></div>
<div class="full registration"><label for="companyRegNo">ทะเบียนนิติบุคคลเลขที่ 13 หลัก *</label><input id="companyRegNo" name="companyRegNo" inputmode="numeric" maxlength="13" aria-describedby="companyRegNoError"><div class="reg-tools"><span class="count" id="digitCount">0/13 หลัก</span><div><button class="lookup" id="dbdHomeButton" type="button">เปิด DBD</button> <button class="lookup" id="dbdLookupButton" type="button">ค้นหาที่ DBD</button></div></div><small class="error" id="companyRegNoError"></small></div>
<div class="full"><label for="companyName">ชื่อนิติบุคคล *</label><input id="companyName" name="companyName" aria-describedby="companyNameError"><small class="error" id="companyNameError"></small></div>
<div><label for="companyType">ประเภทนิติบุคคล</label><select id="companyType" name="companyType"><option value="">-- เลือก --</option><option>บริษัทจำกัด</option><option>บริษัทมหาชนจำกัด</option><option>ห้างหุ้นส่วนจำกัด</option><option>ห้างหุ้นส่วนสามัญนิติบุคคล</option><option>มูลนิธิ</option><option>สมาคม</option><option>อื่น ๆ</option></select></div>
<div><label for="registrationDate">วันที่จดทะเบียน</label><input id="registrationDate" name="registrationDate" maxlength="50"></div>
<div class="full"><label for="companyAddress">ที่อยู่บริษัท</label><textarea id="companyAddress" name="companyAddress"></textarea></div>
<div><label for="phoneNo">โทรศัพท์</label><input id="phoneNo" name="phoneNo" inputmode="tel"></div><div><label for="faxNo">โทรสาร</label><input id="faxNo" name="faxNo" inputmode="tel"></div>
<div class="full authorized"><div><label for="authorizedName">ผู้มีอำนาจ คนที่ 1</label><input id="authorizedName" name="authorizedName"></div><div><label for="authorizedName2">ผู้มีอำนาจ คนที่ 2</label><input id="authorizedName2" name="authorizedName2"></div></div>
<div class="full"><label for="registrarOffice">หน่วยงานที่ออกทะเบียน</label><input id="registrarOffice" name="registrarOffice" value="กรมพัฒนาธุรกิจการค้า กระทรวงพาณิชย์"></div>
<div class="full box"><h3>ผู้ติดต่อคนที่ 1</h3><div class="grid"><div><label for="contactName1">ชื่อ</label><input id="contactName1" name="contactName1"></div><div><label for="contactPhone1">โทรศัพท์</label><input id="contactPhone1" name="contactPhone1"></div><div class="full"><label for="contactEmail1">อีเมล</label><input id="contactEmail1" name="contactEmail1" type="email"><small class="error" id="contactEmail1Error"></small></div></div></div>
<div class="full box"><h3>ผู้ติดต่อคนที่ 2</h3><div class="grid"><div><label for="contactName2">ชื่อ</label><input id="contactName2" name="contactName2"></div><div><label for="contactPhone2">โทรศัพท์</label><input id="contactPhone2" name="contactPhone2"></div><div class="full"><label for="contactEmail2">อีเมล</label><input id="contactEmail2" name="contactEmail2" type="email"><small class="error" id="contactEmail2Error"></small></div></div></div>
<div class="full box"><h3>ข้อมูลสินเชื่อ</h3><label for="loanType">ประเภทสินเชื่อ</label><select id="loanType" name="loanType"><option value="">-- เลือก --</option><option>Lease</option><option>Hire Purchase</option><option>Loan</option><option>Refinance</option><option>Working Capital</option></select></div>
<div class="full box"><h3>รายการทรัพย์สิน</h3><div class="scroll"><table class="assets"><thead><tr><th>จำนวน</th><th>สภาพ</th><th>ยี่ห้อ</th><th>ประเภท / รายละเอียด</th><th>ราคา รวม VAT</th></tr></thead><tbody id="assetRows"></tbody></table></div></div>
</div>
<div class="actions"><button class="secondary" type="reset">ล้างข้อมูล</button><button class="primary" id="submitButton" type="submit">สร้างและดาวน์โหลด PDF</button></div><div id="status" aria-live="polite"></div>
</form></section></main>
<script src="MAPPING1.js"></script>
<script src="MAPPING2.js"></script>
<script>
'use strict';
const assetRows=document.getElementById('assetRows');
for(let i=1;i<=4;i++)assetRows.insertAdjacentHTML('beforeend',`<tr><td><input id="itemQty${i}" name="itemQty${i}" inputmode="numeric"></td><td><select id="itemCondition${i}" name="itemCondition${i}"><option value=""></option><option>ใหม่</option><option>เก่า</option></select></td><td><input id="itemBrand${i}" name="itemBrand${i}"></td><td><input id="itemDetail${i}" name="itemDetail${i}"></td><td><input class="price" id="itemPrice${i}" name="itemPrice${i}" inputmode="decimal"><small class="error" id="itemPrice${i}Error"></small></td></tr>`);
const form=document.getElementById('pdfForm'),reg=document.getElementById('companyRegNo'),digitCount=document.getElementById('digitCount'),statusBox=document.getElementById('status'),submitButton=document.getElementById('submitButton'),dateInput=document.getElementById('documentDate');
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const FONT_BASE='https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-thai@5.2.6/files/';
async function loadBytes(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`โหลดไฟล์ไม่สำเร็จ (${r.status}): ${url}`);return new Uint8Array(await r.arrayBuffer())}
function mappingFor(type){if(typeof MAPPING1==='undefined'||typeof MAPPING2==='undefined')throw Error('โหลด MAPPING1.js หรือ MAPPING2.js ไม่สำเร็จ');return type==='application'?MAPPING2:MAPPING1}
function formatPrice(v){const raw=String(v).replace(/,/g,'').replace(/[^\d.]/g,'');if(!raw)return'';const p=raw.indexOf('.'),whole=(p<0?raw:raw.slice(0,p)).replace(/^0+(?=\d)/,'')||'0',decimal=p<0?'':raw.slice(p+1).replace(/\./g,'').slice(0,2);return whole.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(p<0?'':'.'+decimal)}
form.addEventListener('input',e=>{if(e.target.classList.contains('price'))e.target.value=formatPrice(e.target.value)});
function splitRuns(t){const o=[];for(const c of t){const th=/[\u0E00-\u0E7F\u200B-\u200D]/.test(c),last=o.at(-1);if(last&&last.thai===th)last.text+=c;else o.push({thai:th,text:c})}return o}
function measure(t,s,F){return splitRuns(t).reduce((a,r)=>a+(r.thai?F.thai:F.latin).widthOfTextAtSize(r.text,s),0)}
function draw(page,p,text,F,rgb){let size=p.size||8;const min=p.minSize||6;if(p.maxWidth){const w=measure(text,size,F);if(w>p.maxWidth)size=Math.max(min,size*p.maxWidth/w)}let x=p.x;if(p.align==='center'&&p.maxWidth)x+=(p.maxWidth-measure(text,size,F))/2;for(const r of splitRuns(text)){const font=r.thai?F.thai:F.latin;page.drawText(r.text,{x,y:p.y,size,font,color:rgb(0,0,0)});x+=font.widthOfTextAtSize(r.text,size)}}
let fontsCache;
async function fontFiles(){if(!fontsCache)fontsCache=Promise.all([loadBytes(FONT_BASE+'noto-sans-thai-thai-400-normal.woff'),loadBytes(FONT_BASE+'noto-sans-thai-latin-400-normal.woff').catch(()=>null)]);return fontsCache}
async function createPdf(data,type){if(typeof PDFLib==='undefined'||typeof fontkit==='undefined')throw Error('โหลด pdf-lib หรือ fontkit ไม่สำเร็จ');const cfg=mappingFor(type),{PDFDocument,StandardFonts,rgb}=PDFLib,doc=await PDFDocument.load(await loadBytes(cfg.file));doc.registerFontkit(fontkit);const [thai,latin]=await fontFiles(),F={thai:await doc.embedFont(thai,{subset:true}),latin:latin?await doc.embedFont(latin,{subset:true}):await doc.embedFont(StandardFonts.Helvetica)},pages=doc.getPages();for(const[name,map]of Object.entries(cfg.fields)){const text=String(data[name]||'').trim();if(!text)continue;for(const p of(Array.isArray(map)?map:[map]))if(pages[p.page])draw(pages[p.page],p,text,F,rgb)}const q=cfg.registration,no=data.companyRegNo||'',page=pages[q.page];if(q.mode==='continuous')draw(page,q,no,F,rgb);else[...no].forEach((n,i)=>{if(q.centers?.[i]!==undefined)page.drawText(n,{x:q.centers[i]-F.latin.widthOfTextAtSize(n,q.size)/2,y:q.y,size:q.size,font:F.latin,color:rgb(0,0,0)})});const prefix=type==='application'?'ใบคำขอสินเชื่อ':'หนังสือให้ความยินยอม';return{bytes:await doc.save({useObjectStreams:false}),name:`${prefix} - ${String(data.companyName).replace(/[\\/:*?"<>|]/g,'-')}.pdf`}}
function error(id,msg=''){const el=document.getElementById(id),box=document.getElementById(id+'Error');el?.classList.toggle('invalid',!!msg);if(box)box.textContent=msg}
function collect(){for(let i=1;i<=4;i++){const price=document.getElementById(`itemPrice${i}`);price.value=formatPrice(price.value)}const d=Object.fromEntries(new FormData(form)),m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d.documentDate||'');if(m){d.dateDay=String(+m[3]);d.dateMonth=MONTHS[+m[2]-1];d.dateYear=String(+m[1]+543);d.dateShort=`${m[3]}/${m[2]}/${+m[1]+543}`}return d}
function validate(d){let ok=true;['companyName','companyRegNo','contactEmail1','contactEmail2'].forEach(x=>error(x));if(!d.companyName.trim()){error('companyName','กรุณากรอกชื่อนิติบุคคล');ok=false}if(!/^\d{13}$/.test(d.companyRegNo)){error('companyRegNo','กรุณากรอกเลขทะเบียนให้ครบ 13 หลัก');ok=false}for(const n of[1,2])if(d[`contactEmail${n}`]&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d[`contactEmail${n}`])){error(`contactEmail${n}`,'รูปแบบอีเมลไม่ถูกต้อง');ok=false}return ok}
function save(bytes,name){const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function setToday(){const d=new Date();dateInput.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
setToday();reg.addEventListener('input',()=>{reg.value=reg.value.replace(/\D/g,'').slice(0,13);digitCount.textContent=`${reg.value.length}/13 หลัก`;digitCount.classList.toggle('complete',reg.value.length===13)});
document.getElementById('dbdHomeButton').onclick=()=>open('https://datawarehouse.dbd.go.th/','_blank','noopener');document.getElementById('dbdLookupButton').onclick=()=>{if(!/^\d{13}$/.test(reg.value)){error('companyRegNo','กรุณากรอกเลขทะเบียนให้ครบ 13 หลัก');return}open('https://datawarehouse.dbd.go.th/company/profile/5'+reg.value,'_blank','noopener')};
form.addEventListener('reset',()=>setTimeout(()=>{statusBox.textContent='';statusBox.className='';digitCount.textContent='0/13 หลัก';digitCount.classList.remove('complete');setToday()}));
form.addEventListener('submit',async e=>{e.preventDefault();const d=collect();if(!validate(d))return;submitButton.disabled=true;statusBox.className='loading';statusBox.textContent='กำลังสร้าง PDF...';try{const types=d.template==='both'?['application','disclosure']:[d.template];for(const type of types){const result=await createPdf(d,type);save(result.bytes,result.name);await new Promise(r=>setTimeout(r,700))}statusBox.className='success';statusBox.textContent='สร้างเอกสารเรียบร้อยแล้ว'}catch(err){console.error(err);statusBox.className='error';statusBox.textContent='สร้าง PDF ไม่สำเร็จ: '+err.message}finally{submitButton.disabled=false}});
</script>
</body>
</html>
