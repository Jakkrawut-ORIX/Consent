<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สร้างเอกสาร PDF</title>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#18324a;font-family:Tahoma,Arial,sans-serif}
    main{max-width:820px;margin:28px auto;padding:0 16px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 9px 28px #12324a18}
    h1{margin:0 0 6px}.sub{color:#607b92;margin:0 0 22px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}
    label{display:block;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #b9c9d8;border-radius:8px;font-size:16px}
    input:focus,select:focus{outline:3px solid #2488c722;border-color:#2488c7}.error{display:block;color:#c62828;min-height:18px;margin-top:4px;font-size:13px}
    .count{text-align:right;color:#607b92;font-size:12px;margin-top:4px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}button{padding:12px 18px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}.main{background:#176eb1;color:#fff;border:0}.clear{background:#fff;border:1px solid #b9c9d8}button:disabled{opacity:.6;cursor:wait}
    #status{text-align:right;min-height:22px;margin-top:10px}.ok{color:#08783e}.bad{color:#c62828}.note{margin-top:22px;padding:13px;background:#fff6dc;border-left:4px solid #d39a1d;border-radius:7px;color:#74580d;font-size:13px;line-height:1.55}
    @media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{flex-direction:column-reverse}.actions button{width:100%}}
  </style>
</head>
<body>
<main><section class="card">
  <h1>ระบบสร้างเอกสาร PDF</h1>
  <p class="sub">ทำงานทั้งหมดใน Browser ไม่ส่งข้อมูลไป Server และใช้งานบน GitHub Pages ได้โดยตรง</p>
  <form id="form" novalidate>
    <div class="grid">
      <div class="full"><label for="template">เอกสารต้นฉบับ</label><select id="template" name="template"><option value="application">TOLC Consent & Application</option><option value="disclosure">Consent for Disclosure Information</option></select></div>
      <div class="full"><label for="companyName">ข้าพเจ้า (นิติบุคคลชื่อ) *</label><input id="companyName" name="companyName" maxlength="150" required><small class="error" id="companyNameError"></small></div>
      <div><label for="companyType">ประเภทนิติบุคคล</label><select id="companyType" name="companyType"><option value="">-- เลือก --</option><option>บริษัทจำกัด</option><option>บริษัทมหาชนจำกัด</option><option>ห้างหุ้นส่วนจำกัด</option><option>ห้างหุ้นส่วนสามัญนิติบุคคล</option><option>มูลนิธิ</option><option>สมาคม</option><option>อื่น ๆ</option></select></div>
      <div><label for="companyRegNo">เลขทะเบียนนิติบุคคล 13 หลัก *</label><input id="companyRegNo" name="companyRegNo" inputmode="numeric" maxlength="13" required><div class="count"><span id="count">0</span>/13 หลัก</div><small class="error" id="companyRegNoError"></small></div>
      <div><label for="phoneNo">หมายเลขโทรศัพท์</label><input id="phoneNo" name="phoneNo" inputmode="tel" maxlength="20"></div>
      <div><label for="registrarOffice">หน่วยงานที่ออกทะเบียน</label><input id="registrarOffice" name="registrarOffice" value="กรมพัฒนาธุรกิจการค้า กระทรวงพาณิชย์"></div>
      <div><label for="authorizedName">ผู้มีอำนาจกระทำการ คนที่ 1</label><input id="authorizedName" name="authorizedName"></div>
      <div><label for="authorizedName2">ผู้มีอำนาจกระทำการ คนที่ 2</label><input id="authorizedName2" name="authorizedName2"></div>
    </div>
    <div class="actions"><button type="reset" class="clear">ล้างข้อมูล</button><button id="submit" type="submit" class="main">สร้างและดาวน์โหลด PDF</button></div>
    <div id="status"></div>
  </form>
  <div class="note"><b>หมายเหตุ:</b> ค่าพิกัดในไฟล์นี้เป็นค่าตั้งต้น แก้เฉพาะส่วน <code>MAPPING</code> หลังทดลองดาวน์โหลด PDF</div>
</section></main>
<script>
const { PDFDocument, rgb } = PDFLib;
const form = document.getElementById('form');
const regInput = document.getElementById('companyRegNo');
const count = document.getElementById('count');
const statusBox = document.getElementById('status');
const submitButton = document.getElementById('submit');

// พิกัด PDF เริ่มจากมุมซ้ายล่าง แยก Mapping สำหรับ PDF แต่ละไฟล์
const MAPPING = {
  application: {
    file: 'assets/template-application.pdf', output: 'tolc-application-filled.pdf',
    fields: {
      companyName:{page:0,x:175,y:486,size:14,maxWidth:240}, companyType:{page:0,x:455,y:486,size:14,maxWidth:125},
      phoneNo:{page:0,x:450,y:443,size:14,maxWidth:130}, authorizedName:{page:0,x:120,y:405,size:14,maxWidth:210},
      authorizedName2:{page:0,x:365,y:405,size:14,maxWidth:210}, registrarOffice:{page:0,x:385,y:366,size:11,maxWidth:195}
    },
    registration:{page:0,y:444,size:14,centers:[271,310,343,376,409,448,481,514,547,580,619,652,685]}
  },
  disclosure: {
    file: 'assets/template-disclosure.pdf', output: 'disclosure-consent-filled.pdf',
    fields: {
      companyName:{page:0,x:175,y:486,size:14,maxWidth:240}, companyType:{page:0,x:455,y:486,size:14,maxWidth:125},
      phoneNo:{page:0,x:430,y:443,size:14,maxWidth:145}, authorizedName:{page:0,x:120,y:405,size:14,maxWidth:205},
      authorizedName2:{page:0,x:355,y:405,size:14,maxWidth:215}, registrarOffice:{page:0,x:375,y:366,size:11,maxWidth:200}
    },
    registration:{page:0,y:444,size:14,centers:[267,305,337,369,401,439,471,503,535,567,605,637,669]}
  }
};

regInput.addEventListener('input',()=>{regInput.value=regInput.value.replace(/\D/g,'').slice(0,13);count.textContent=regInput.value.length});
form.addEventListener('reset',()=>setTimeout(()=>{count.textContent='0';statusBox.textContent='';clearErrors()},0));
function clearErrors(){document.getElementById('companyNameError').textContent='';document.getElementById('companyRegNoError').textContent=''}
function validate(data){clearErrors();let ok=true;if(!data.companyName.trim()){document.getElementById('companyNameError').textContent='กรุณากรอกชื่อนิติบุคคล';ok=false}if(!/^\d{13}$/.test(data.companyRegNo)){document.getElementById('companyRegNoError').textContent='ต้องเป็นตัวเลขครบ 13 หลัก';ok=false}return ok}
async function getBytes(url){const r=await fetch(url);if(!r.ok)throw new Error('โหลดไฟล์ไม่สำเร็จ: '+url);return new Uint8Array(await r.arrayBuffer())}
function download(bytes,name){const blob=new Blob([bytes],{type:'application/pdf'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

async function createPdf(data){
  const config=MAPPING[data.template];
  const [templateBytes,fontBytes]=await Promise.all([getBytes(config.file),getBytes('assets/NotoSansThai-Regular.woff')]);
  const pdfDoc=await PDFDocument.load(templateBytes,{updateMetadata:false});
  pdfDoc.registerFontkit(fontkit);
  const font=await pdfDoc.embedFont(fontBytes,{subset:true});
  const pages=pdfDoc.getPages();
  for(const [name,pos] of Object.entries(config.fields)){
    const value=String(data[name]||'').trim();if(!value)continue;
    pages[pos.page].drawText(value,{x:pos.x,y:pos.y,size:pos.size,font,color:rgb(0,0,0),maxWidth:pos.maxWidth,lineHeight:pos.size*1.15});
  }
  [...data.companyRegNo].forEach((digit,i)=>{const r=config.registration;const w=font.widthOfTextAtSize(digit,r.size);pages[r.page].drawText(digit,{x:r.centers[i]-w/2,y:r.y,size:r.size,font,color:rgb(0,0,0)})});
  return {bytes:await pdfDoc.save({useObjectStreams:false}),name:config.output};
}

form.addEventListener('submit',async e=>{
  e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());if(!validate(data))return;
  submitButton.disabled=true;submitButton.textContent='กำลังสร้าง...';statusBox.className='';statusBox.textContent='';
  try{const result=await createPdf(data);download(result.bytes,result.name);statusBox.className='ok';statusBox.textContent='สร้าง PDF เรียบร้อย'}
  catch(err){console.error(err);statusBox.className='bad';statusBox.textContent='เกิดข้อผิดพลาด: '+err.message}
  finally{submitButton.disabled=false;submitButton.textContent='สร้างและดาวน์โหลด PDF'}
});
</script>
</body>
</html>
