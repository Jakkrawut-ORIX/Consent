<div class="full"><label for="consentPlace">ทำที่ <small>(Consent)</small></label><input id="consentPlace" name="consentPlace" value="บริษัท ไทยโอริกซ์ลีสซิ่ง จำกัด"/></div>

<div class="full"><label for="companyName">ข้าพเจ้า (นิติบุคคลชื่อ) *</label><input id="companyName" name="companyName" required=""/><small class="error" id="companyNameError"></small></div>
<div><label for="companyType">ประเภทนิติบุคคล <small>(Consent)</small></label><select id="companyType" name="companyType"><option value="">-- เลือกประเภท --</option><option>บริษัทจำกัด</option><option>บริษัทมหาชนจำกัด</option><option>ห้างหุ้นส่วนจำกัด</option><option>ห้างหุ้นส่วนสามัญนิติบุคคล</option><option>มูลนิธิ</option><option>สมาคม</option><option>อื่น ๆ</option></select></div>
<div><label for="registrationDate">วันที่จดทะเบียน</label><input autocomplete="off" id="registrationDate" inputmode="numeric" maxlength="10" name="registrationDate" placeholder="เช่น 27/09/2542" type="text"/></div>
<div class="full"><label for="companyAddress">ที่อยู่บริษัท <small>(Application)</small></label><textarea id="companyAddress" name="companyAddress"></textarea></div>
<div><label for="phoneNo">หมายเลขโทรศัพท์</label><input id="phoneNo" inputmode="tel" name="phoneNo"/></div><div class="full authorized-row"><div><div><label for="authorizedName">ผู้มีอำนาจกระทำการ คนที่ 1</label><input id="authorizedName" name="authorizedName"/></div></div><div><div><label for="authorizedName2">ผู้มีอำนาจกระทำการ คนที่ 2</label><input id="authorizedName2" name="authorizedName2"/></div></div></div><div class="full"><label for="registrarOffice">หน่วยงานที่ออกทะเบียน <small>(Consent)</small></label><input id="registrarOffice" name="registrarOffice" value="กรมพัฒนาธุรกิจการค้า กระทรวงพาณิชย์"/></div></div><div class="actions"><button class="secondary" type="reset">ล้างข้อมูล</button><button class="primary" id="submitButton" type="submit">สร้างและดาวน์โหลด PDF</button></div><div id="status"></div></form></section></main><script src="MAPPING1.js"></script><script src="MAPPING2.js"></script><script>

function b64(s){const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b}const MAPPING={application:MAPPING1,disclosure:MAPPING2};const f=document.getElementById('pdfForm'),r=document.getElementById('companyRegNo'),c=document.getElementById('digitCount'),st=document.getElementById('status'),sb=document.getElementById('submitButton');r.oninput=()=>{r.value=r.value.replace(/\D/g,'').slice(0,13);c.textContent=`${r.value.length}/13 หลัก`;c.classList.toggle('complete',r.value.length===13)};document.getElementById('dbdHomeButton').onclick=()=>open('https://datawarehouse.dbd.go.th/','_blank');document.getElementById('dbdLookupButton').onclick=()=>{if(!/^\d{13}$/.test(r.value))return alert('กรุณากรอกเลขทะเบียนให้ครบ 13 หลัก');open('https://datawarehouse.dbd.go.th/company/profile/5'+r.value,'_blank')};async function bytes(u){const x=await fetch(u,{cache:'no-store'});if(!x.ok)throw Error('โหลดไฟล์ไม่สำเร็จ '+u);return new Uint8Array(await x.arrayBuffer())}async function make(data,type){const {PDFDocument,StandardFonts,rgb}=PDFLib,cf=MAPPING[type],doc=await PDFDocument.load(await bytes(cf.file));doc.registerFontkit(fontkit);const tf=await doc.embedFont(b64(THAI_FONT_BASE64),{subset:true}),lf=await doc.embedFont(StandardFonts.Helvetica),pages=doc.getPages();for(const [n,p] of Object.entries(cf.fields)){const v=String(data[n]||'').trim();if(v)pages[p.page].drawText(v,{x:p.x,y:p.y,size:p.size,font:/[฀-๿]/.test(v)?tf:lf,color:rgb(0,0,0),maxWidth:p.maxWidth,lineHeight:p.lineHeight||p.size*1.15})}const q=cf.registration;if(q.mode==='continuous')pages[q.page].drawText(data.companyRegNo,{x:q.x,y:q.y,size:q.size,font:lf});else[...data.companyRegNo].forEach((d,i)=>pages[q.page].drawText(d,{x:q.centers[i]-lf.widthOfTextAtSize(d,q.size)/2,y:q.y,size:q.size,font:lf}));const safe=String(data.companyName).replace(/[\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().slice(0,120),prefix=type==='application'?'ใบคำขอสินเชื่อ':'หนังสือให้ความยินยอม';return{data:await doc.save({useObjectStreams:false}),name:`${prefix} - ${safe}.pdf`}}function dl(x,n){const u=URL.createObjectURL(new Blob([x],{type:'application/pdf'})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(!d.companyName.trim()||!/^\d{13}$/.test(d.companyRegNo))return alert('กรุณากรอกชื่อบริษัทและเลขทะเบียน 13 หลัก');sb.disabled=true;st.className='loading';st.textContent='กำลังสร้างเอกสาร...';try{const types=d.template==='both'?['application','disclosure']:[d.template];for(const t of types){const x=await make(d,t);dl(x.data,x.name);await new Promise(z=>setTimeout(z,700))}st.className='success';st.textContent='สร้างเอกสารเรียบร้อย'}catch(x){st.className='error';st.textContent=x.message}finally{sb.disabled=false}};
